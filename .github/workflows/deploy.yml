name: Deploy & Verify HMOS Sovereign Studio (www.storive.in)

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: Production
      url: https://www.storive.in
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production bundle
        run: npm run build

      - name: Remove dead Vercel deployments from GitHub
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/deployments?per_page=50" --jq '.[].id'); do
            URLS=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[].environment_url, .[].target_url, .[].log_url' 2>/dev/null || true)
            if echo "$URLS" | grep -qi "vercel"; then
              gh api --method POST "repos/${{ github.repository }}/deployments/$id/statuses" -f state='inactive' -f description='Removed dead Vercel deployment' >/dev/null 2>&1 || true
              gh api --method DELETE "repos/${{ github.repository }}/deployments/$id" >/dev/null 2>&1 || true
            fi
          done
