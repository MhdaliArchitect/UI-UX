name: Deploy HMOS Sovereign Studio (www.storive.in)

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || 'https://www.storive.in' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build production bundle (dist)
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload production dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages (Unlimited Free Hosting)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Purge dead Vercel deployments & lock GitHub Deployments to www.storive.in
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          node -e '
          const { execSync } = require("child_process");
          function gh(args) {
            try {
              return execSync("gh api " + args, { encoding: "utf8", stdio: ["pipe", "pipe", "ignore"] });
            } catch (e) {
              return "";
            }
          }
          const raw = gh("\"repos/" + process.env.REPO + "/deployments?per_page=100\"");
          if (!raw) process.exit(0);
          const deployments = JSON.parse(raw);
          const vercelEnvs = new Set();
          const vercelIds = [];

          for (const d of deployments) {
            const statusesRaw = gh("\"repos/" + process.env.REPO + "/deployments/" + d.id + "/statuses?per_page=30\"");
            const combined = JSON.stringify(d) + " " + statusesRaw;
            if (/vercel/i.test(combined)) {
              vercelIds.push(d.id);
              if (d.environment) vercelEnvs.add(d.environment);
            }
          }

          for (const envName of vercelEnvs) {
            const createOut = gh("--method POST \"repos/" + process.env.REPO + "/deployments\" -f ref=\"" + process.env.SHA + "\" -f environment=\"" + envName + "\" -F auto_merge=false -F required_contexts=\"[]\"");
            try {
              const created = JSON.parse(createOut);
              if (created && created.id) {
                gh("--method POST \"repos/" + process.env.REPO + "/deployments/" + created.id + "/statuses\" -f state=\"success\" -f environment_url=\"https://www.storive.in\" -f log_url=\"https://www.storive.in\" -F auto_inactive=true -f description=\"Live at www.storive.in\"");
              }
            } catch (e) {}
          }

          for (const id of vercelIds) {
            gh("--method POST \"repos/" + process.env.REPO + "/deployments/" + id + "/statuses\" -f state=\"inactive\" -f description=\"Removed dead Vercel deployment\"");
            gh("--method DELETE \"repos/" + process.env.REPO + "/deployments/" + id + "\"");
          }
          '
